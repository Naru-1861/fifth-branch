<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>나루슈퍼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f5eedf; --paper2:#fffaf0; --ink:#2b2a28; --muted:#7b7364; --blue:#2f5fae; --line:#e3d8c2; --night:#17181c; --gold:#b9a46a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#dcdcd5;font-family:"Gowun Dodum",system-ui,sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
  .lbl .nm{font-size:11px;line-height:1;padding:4px 8px;border-radius:999px;background:rgba(40,36,30,.55);color:#fff;white-space:nowrap;transition:opacity .25s}
  .lbl.npc .nm{opacity:0}
  .lbl.npc.near .nm{opacity:.85}
  .lbl.me .nm{background:var(--blue);font-weight:700;font-size:12px}
  .lbl.crow .nm{background:rgba(12,12,14,.78)}
  .lbl.me.crow .nm{background:var(--night);box-shadow:0 0 0 1.5px var(--gold) inset}
  .lbl.owner .nm{background:#9e3a2c;font-weight:700;font-size:12px}
  .lbl.owner .nm i{font-style:normal;opacity:.8;font-weight:400;margin-left:4px}
  .bubble{position:relative;background:#fffdf6;color:var(--ink);font-weight:700;font-size:13px;padding:5px 10px;border-radius:12px;margin-bottom:6px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transform:translateY(5px) scale(.92);transition:opacity .18s,transform .18s;white-space:nowrap}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fffdf6}
  .bubble.on{opacity:1;transform:none}
  /* 뽑은 카드 3초 공유 */
  .pshare{display:none;flex-direction:column;align-items:center;margin-bottom:6px;transform-origin:50% 100%}
  .pshare.on{display:flex;animation:psLife 3s forwards}
  .pcard{width:48px;aspect-ratio:720/1112;perspective:420px}
  .pcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:psFlip 3s forwards}
  .pcard img{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:4px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 12px rgba(0,0,0,.35)}
  .pcard .f{transform:rotateY(180deg)}
  .pshare.crow .pcard img.f{box-shadow:0 0 0 1.5px #b9a46a,0 5px 12px rgba(0,0,0,.35)}
  .pcap{margin-top:4px;font-family:"Gowun Batang";font-weight:700;font-size:10.5px;color:#f6eedb;background:rgba(20,26,46,.82);padding:2px 7px;border-radius:999px;white-space:nowrap;opacity:0;animation:psCap 3s forwards}
  @keyframes psLife{0%{opacity:0;transform:translateY(16px) scale(.35)}12%{opacity:1;transform:translateY(-5px) scale(1.08)}20%{transform:none}84%{opacity:1;transform:translateY(-3px)}100%{opacity:0;transform:translateY(-18px) scale(.92)}}
  @keyframes psFlip{0%,16%{transform:rotateY(0)}34%{transform:rotateY(180deg) scale(1.12)}42%,100%{transform:rotateY(180deg)}}
  @keyframes psCap{0%,36%{opacity:0;transform:translateY(-3px)}46%,100%{opacity:1;transform:none}}

  #hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px;pointer-events:none;z-index:5}
  #hud .right{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  #hud .left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .pill.sij{font-size:12.5px;font-variant-numeric:tabular-nums;transition:background .6s,color .6s}
  .pill.sij.night{background:rgba(22,28,52,.88);color:#e6e2d6;border-color:rgba(255,255,255,.08)}
  .pill.sij.jin{background:#14203a;color:#f0dfb4;box-shadow:0 0 0 1.5px #b9a46a inset}
  .pill{background:rgba(255,250,240,.92);border:1px solid rgba(0,0,0,.07);border-radius:999px;padding:7px 12px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.08);white-space:nowrap}
  .pill b{font-family:"Do Hyeon";font-weight:400;color:var(--blue);font-size:15px;letter-spacing:.04em;margin-right:4px}
  .pill.role.crow{background:var(--night);color:#efe6cf;border-color:#000}
  button.pill{pointer-events:auto;cursor:pointer;font-family:inherit;color:inherit}
  html,body,#c{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .wingp{display:flex;align-items:center;gap:7px}
  .wingp i{display:block;width:74px;height:7px;border-radius:4px;background:#e3d8c2;overflow:hidden}
  .wingp i b{display:block;height:100%;width:100%;background:var(--blue);border-radius:4px;transition:background .3s}
  .wingp.crow{background:var(--night);color:#efe6cf;border-color:#000}
  .wingp.crow i{background:#3a3a40}
  .wingp.crow i b{background:var(--gold)}
  .wingp.low i b{background:#c8463a}
  .wingp em{font-style:normal;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  #emotes{position:fixed;right:12px;bottom:14px;display:flex;gap:8px;z-index:6}
  #emotes button{display:flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:14px;padding:10px 15px 10px 12px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:rgba(255,250,240,.95);color:var(--ink);box-shadow:0 3px 12px rgba(0,0,0,.12);cursor:pointer;transition:transform .12s}
  #emotes button:active{transform:scale(.94)}
  #emotes svg{flex:none}
  #help{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);font-size:12px;color:#4a463e;background:rgba(255,250,240,.86);padding:7px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .6s;z-index:5}
  @media (max-width:520px){#help{font-size:11px;padding:6px 10px;white-space:normal;width:max-content;max-width:92vw;text-align:center} #countDetail{display:none} #hud .right{flex-direction:column;align-items:flex-end} .pill{font-size:12px;padding:6px 10px}}

  .overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:10}
  .hidden{display:none!important}
  #entry{background:rgba(236,228,210,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .card{width:100%;max-width:360px;background:var(--paper);border:1px solid rgba(0,0,0,.07);border-radius:20px;padding:26px 20px 20px;box-shadow:0 20px 50px rgba(40,30,10,.18)}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted)}
  h1{font-family:"Do Hyeon";font-weight:400;font-size:46px;letter-spacing:.14em;color:var(--blue);margin:6px 0 2px}
  .lede{margin:0 0 16px;color:#5a5448;font-size:14px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:10px;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,border-color .2s}
  .opt:active{transform:scale(.985)}
  .opt:hover{border-color:#cdbf9f}
  .opt b{display:block;font-size:16px}
  .opt small{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
  .opt svg{flex:none}
  #entry .card{max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto}
  .sec{font-size:11.5px;letter-spacing:.12em;color:var(--muted);margin:2px 2px 6px}
  #savedWrap{margin-bottom:14px}
  .saved{display:flex;align-items:stretch;gap:6px;margin-top:6px}
  .sv-go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
  .sv-go:active{transform:scale(.985)}
  .sv-go b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sv-go small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  .sv-go span.t{min-width:0}
  .dot{flex:none;width:22px;height:22px;border-radius:50%;background:#15171b;box-shadow:inset -5px -5px 0 #f4f2ec}
  .dot.crow{background:#0b0b0d;box-shadow:inset 0 0 0 2px var(--gold)}
  .sv-del{flex:none;width:38px;font-size:18px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:12px;cursor:pointer}
  #stepName{margin-top:4px}
  .back{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer}
  .who{display:inline-flex;align-items:center;gap:8px;margin:6px 0 12px;font-weight:700;font-size:14px;padding:6px 12px 6px 8px;border-radius:999px;background:#fff;border:1px solid var(--line)}
  .who.crow{background:var(--night);color:#efe6cf;border-color:#000}
  .fl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .fl input{display:block;width:100%;margin-top:5px;font:inherit;font-size:16px;color:var(--ink);padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff}
  .fl input:focus{outline:2px solid var(--gold);outline-offset:1px}
  #codeInput{letter-spacing:.06em;text-transform:uppercase}
  .chk{display:flex;align-items:flex-start;gap:9px;font-size:14px;margin:4px 2px 2px;cursor:pointer}
  .chk input{width:18px;height:18px;margin:1px 0 0;accent-color:#2f5fae;flex:none}
  .chk small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  .btn-go{display:block;width:100%;font:inherit;font-weight:700;font-size:16px;border:0;border-radius:14px;padding:14px;margin-top:8px;background:var(--blue);color:#fff;cursor:pointer}
  .btn-go.crow{background:var(--night);color:#efe6cf}
  .err{color:#b43b2a;font-size:12.5px;min-height:18px;margin:6px 2px 0}
  .hint{font-size:11.5px;color:var(--muted);margin:2px 2px 0}
  .hint code{background:#ece3cf;padding:1px 5px;border-radius:5px;font-size:11.5px}

  /* 오늘의 카드 */
  #result{background:rgba(18,20,30,.72)}
  .sheet{width:min(360px,94vw);display:flex;flex-direction:column;align-items:center}
  .r-kicker{color:#e9dcc0;font-size:12px;letter-spacing:.24em;margin-bottom:12px;opacity:0}
  #result.play .r-kicker{animation:fadeUp .4s .1s forwards}
  .capsule{position:absolute;left:50%;top:38%;width:80px;height:80px;margin:-40px 0 0 -40px;z-index:3;pointer-events:none}
  .capsule i{position:absolute;left:0;width:80px;height:40px;display:block}
  .capsule .top{top:0;border-radius:40px 40px 0 0;background:var(--c,#2f5fae);box-shadow:inset -8px 6px 0 rgba(255,255,255,.22)}
  .capsule .bot{top:40px;border-radius:0 0 40px 40px;background:#f7f3ea}
  #result.play .capsule .top{animation:capTop .6s .1s cubic-bezier(.3,.7,.3,1) forwards}
  #result.play .capsule .bot{animation:capBot .6s .1s ease-in forwards}
  #result.again .capsule{display:none}
  @keyframes capTop{to{transform:translate(-30px,-60px) rotate(-38deg);opacity:0}}
  @keyframes capBot{to{transform:translate(22px,50px) rotate(22deg);opacity:0}}
  .flip{position:relative;width:min(66vw,280px,calc((100vh - 270px) * .647));aspect-ratio:720/1112;perspective:1200px;opacity:0;transform:translateY(18px) scale(.94)}
  #result.play .flip{animation:fadeUp .5s .45s cubic-bezier(.2,.8,.2,1) forwards}
  #result.again .flip{animation-delay:.05s}
  .flip .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
  .flip.turn .inner{transform:rotateY(180deg)}
  .flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6%/4%;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.45);background:#1d2a48}
  .flip .face img{width:100%;height:100%;display:block;object-fit:cover}
  .flip .front{transform:rotateY(180deg)}
  .r-title{font-family:"Gowun Batang";font-weight:700;color:#f6eedb;font-size:22px;letter-spacing:.06em;margin:16px 0 0;opacity:0;min-height:30px}
  .r-title.on{animation:fadeUp .4s forwards}
  .after{color:#e8dfcd;font-size:13px;text-align:center;margin:8px 6px 0;line-height:1.6;opacity:0;word-break:keep-all}
  .actions{display:flex;gap:8px;margin-top:12px;width:100%;opacity:0;transform:translateY(8px)}
  .after.on,.actions.on{animation:fadeUp .4s forwards}
  .actions button{flex:1;font:inherit;font-weight:700;font-size:15px;padding:13px;border-radius:12px;border:0;cursor:pointer}
  #rAgain{background:#000;color:#efe6cf;box-shadow:0 0 0 1px #3a3a3a inset}
  #rClose{background:#fffaf0;color:var(--ink)}
  @keyframes fadeUp{to{opacity:1;transform:none}}

  /* 주인 아주머니 대화 */
  #talk{align-items:end;background:rgba(20,18,15,.35)}
  .talk-sheet{width:min(440px,100%);background:var(--paper);border-radius:20px;padding:18px 18px 16px;box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:fadeUp .3s forwards;opacity:0;transform:translateY(20px)}
  .talk-who{display:inline-block;background:#9e3a2c;color:#fff;font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:999px}
  .talk-line{font-family:"Gowun Batang";font-size:16px;line-height:1.75;margin:10px 2px 14px;word-break:keep-all}
  .talk-opts{display:flex;flex-direction:column;gap:8px}
  .talk-opts button{text-align:left;font:inherit;font-size:15px;font-weight:700;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);cursor:pointer}
  .talk-opts button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
  .talk-opts button.main{background:var(--night);color:#efe6cf;border-color:#000}
  .talk-opts button.main small{color:#b5ab93}

  /* 문진 */
  #munjin{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column}
  .mj-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--night);color:#efe6cf;font-size:12.5px}
  .mj-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mj-bar button{flex:none;font:inherit;font-weight:700;font-size:13px;border:0;border-radius:999px;padding:8px 13px;background:#efe6cf;color:var(--night);cursor:pointer}
  #mjFrame{flex:1;width:100%;border:0;background:#fff}
  /* 문진을 불러오는 동안: 선별 중 */
  #mjWait{position:absolute;left:0;right:0;bottom:0;top:var(--mjbar,52px);z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(120% 80% at 50% 40%,#f6efe0,#e8dcc3);transition:opacity .35s}
  #mjWait.out{opacity:0}
  .mw-ring{position:relative;width:236px;height:236px;margin-bottom:4px}
  .mw-ring:before{content:"";position:absolute;inset:26px;border-radius:50%;border:1px dashed rgba(43,42,40,.25);animation:mwSpin 14s linear infinite}
  @keyframes mwSpin{to{transform:rotate(360deg)}}
  .mw-ring span{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;display:grid;place-items:center;border-radius:50%;
    z-index:2;font-family:"Gowun Batang";font-weight:700;font-size:17px;color:rgba(43,42,40,.38);transition:color .12s,background .12s,transform .12s,box-shadow .12s}
  .mw-ring span.on{color:#f6eedb;background:#9e3a2c;transform:scale(1.18);box-shadow:0 4px 12px rgba(158,58,44,.35)}
  .mw-ring span.land{color:#f0dfb4;background:#14203a;box-shadow:0 0 0 2px #b9a46a,0 6px 16px rgba(20,32,58,.4);transition:transform .25s cubic-bezier(.3,1.6,.5,1),color .12s,background .12s}
  @keyframes mwLand{0%{transform:scale(1.18)}45%{transform:scale(1.55)}100%{transform:scale(1.3)}}
  .mw-ring .mw-deck{position:absolute;left:50%;top:50%;width:62px;height:96px;margin:-48px 0 0 -31px}
  .mw-deck{position:relative;width:92px;height:142px;margin-bottom:10px}
  .mw-deck i{position:absolute;inset:0;border-radius:5px;background:#1d2a48 url(jinsi/img/dan/back.webp) center/cover;box-shadow:0 8px 20px rgba(40,30,10,.28);
    animation:mwShuffle 1.8s cubic-bezier(.45,.05,.3,1) infinite}
  .mw-deck i:nth-child(2){animation-delay:-.6s}
  .mw-deck i:nth-child(3){animation-delay:-1.2s}
  @keyframes mwShuffle{0%{transform:translate(0,0) rotate(-4deg);z-index:3}22%{transform:translate(28px,-14px) rotate(13deg);z-index:3}
    34%{transform:translate(28px,-14px) rotate(13deg);z-index:1}56%{transform:translate(0,0) rotate(3deg);z-index:1}100%{transform:translate(0,0) rotate(-4deg);z-index:2}}
  .mw-title{font-family:"Gowun Batang";font-weight:700;font-size:22px;letter-spacing:.3em;color:#2b2a28;padding-left:.3em}
  .mw-title .dots b{display:inline-block;font-weight:700;animation:mwDot 1.2s infinite}
  .mw-title .dots b:nth-child(2){animation-delay:.15s}
  .mw-title .dots b:nth-child(3){animation-delay:.3s}
  @keyframes mwDot{0%,60%,100%{transform:none;opacity:.35}30%{transform:translateY(-5px);opacity:1}}
  .mw-line{margin:0;font-size:13.5px;color:#6f6656;min-height:20px;transition:opacity .3s}
  .mw-line.fade{opacity:0}
  .mw-bar{width:150px;height:3px;border-radius:2px;background:rgba(43,42,40,.12);overflow:hidden;position:relative}
  .mw-bar span{position:absolute;top:0;bottom:0;width:40%;border-radius:2px;background:#9e3a2c;animation:mwBar 1.3s ease-in-out infinite}
  @keyframes mwBar{0%{left:-40%}100%{left:100%}}

  #toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,10px);max-width:88vw;background:rgba(30,28,25,.9);color:#fff;font-size:13.5px;line-height:1.5;
    padding:10px 15px;border-radius:12px;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:40;word-break:keep-all}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .fatal{position:fixed;inset:0;display:grid;place-items:center;padding:30px;text-align:center;background:var(--paper);font-size:15px;z-index:99}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="hud" class="hidden">
  <div class="left">
    <div class="pill" id="count"><b>나루슈퍼</b><span id="countTxt"></span><span id="countDetail"></span></div>
    <div class="pill sij" id="sijin"></div>
  </div>
  <div class="right">
    <div class="pill role" id="badge"></div>
    <button class="pill" id="mute" type="button">소리 켬</button>
    <div class="pill wingp hidden" id="wingPill"><span>날개</span><i><b id="wingBar"></b></i><em id="wingTxt"></em></div>
  </div>
</div>
<div id="emotes" class="hidden">
  <button id="eBow" type="button" title="인사 (1)"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="9" cy="12" rx="6" ry="4.2" fill="#2b2a28"/><circle cx="15" cy="14" r="2.8" fill="#2b2a28"/><path d="M17.3 15.2 L19.5 17.4 L16.6 16.6Z" fill="#2b2a28"/><path d="M3.5 10.5 L1 6.5 L5 9.2Z" fill="#2f5fae"/><path d="M9 3.5v2.2M12.5 4.5l-1 1.8M5.5 4.5l1 1.8" stroke="#c8463a" stroke-width="1.4" stroke-linecap="round"/></svg>인사</button>
  <button id="eShake" type="button" title="털 털기 (2)"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="12" rx="5.4" ry="5" fill="#2b2a28"/><circle cx="10" cy="6.2" r="3" fill="#2b2a28"/><path d="M2.5 9.5q-1.5 2.5 0 5M17.5 9.5q1.5 2.5 0 5M4.6 7.6q-1 1.4 0 2.9M15.4 7.6q1 1.4 0 2.9" stroke="#2f5fae" stroke-width="1.3" fill="none" stroke-linecap="round"/><ellipse cx="16.5" cy="4" rx="1.6" ry=".7" fill="#9b8a6a" transform="rotate(-30 16.5 4)"/><ellipse cx="3.5" cy="3.8" rx="1.5" ry=".6" fill="#9b8a6a" transform="rotate(25 3.5 3.8)"/></svg>털 털기</button>
</div>
<div id="help" class="hidden">탭하면 이동 · 꾹 누르면 날기 · 뽑기기계에서 진시 오늘의 카드</div>

<div id="entry" class="overlay">
  <div class="card">

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function fatal(msg){ const d=document.createElement('div'); d.className='fatal'; d.textContent=msg; document.body.appendChild(d); }
if(!window.THREE){ fatal('3D 화면을 불러오지 못했어요. 새로고침해 주세요.'); return; }

const mem = {};
const store = {
  get(k){ try{ const v=localStorage.getItem(k); return v!==null ? v : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ---------------- 설정 ----------------
   입장코드·하루 1장 제한은 프로토타입이라 브라우저 안에서만 확인합니다.
   실제 서비스에서는 서버(Cloudflare Worker 등)가 확인하고 셉니다. */
const ENTRY_CODES = ['NARU-1861'];
const SHORE = -16.05, SHORE_E = 110;                     // 강둑 선(이 서쪽은 강)
const AREA = { x0:-16, x1:18, z0:.9, z1:14 };          // 돌아다닐 수 있는 땅 (이전의 약 5.7배)
const PIER = { x0:-21.4, x1:-15.9, z0:5.75, z1:6.65 };  // 나루터 나무 다리

/* 진시(辰時) · 심청전 단 22장 — 미우현첩 문진과 같은 순서·이름·그림 */
const HAN = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一'];
const DAN = ['無心出門','掌中之具','沈默之書','豊土餘香','石造之堤','舊路傳承','兩心一岐','前進不顧','柔手馴獸','獨燈深夜','輪轉無常','兩秤等分',
             '逆懸停雲','斷絶新生','兩水相和','自縛之鎖','崩壁瞬光','殘光導引','神起幻影','白日全開','名號復唱','環成無缺'];
const cardSrc = i => `jinsi/img/dan/dan-${String(i).padStart(2,'0')}-full.webp`;
const cardSrcS = i => `jinsi/img/dan/dan-${String(i).padStart(2,'0')}-s.webp`;
const cardName = i => `${HAN[i]} ${DAN[i]}`;

const MACHINE_DEFS = [
  {id:'m1', color:0xc8463a, css:'#c8463a', x:4.9},
  {id:'m2', color:0x2f5fae, css:'#2f5fae', x:5.8},
  {id:'m3', color:0xd29a1c, css:'#d29a1c', x:6.7}
];
const PLACES = ['먼동','윗마을','나루터','감나무','돌담','장독대','고샅','징검다리','솔밭','앞개울','방앗간','우물가','느티나무','논두렁'];
const randName = kind => `${pick(PLACES)} ${kind==='crow'?'까마귀':'까치'}`;

/* ---------------- 렌더러 ---------------- */
let renderer;
try{ renderer = new THREE.WebGLRenderer({canvas:$('#c'), antialias:true}); }
catch(e){ fatal('이 기기에서는 3D 화면을 열 수 없어요.'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 240);

/* ---------------- 텍스처 도우미 ---------------- */
const fontTex = [];
function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); draw(x,w,h);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4;
  if(repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]); }
  t.userData={canvas:c, draw}; return t;
}
function redrawTex(t){ const c=t.userData.canvas, x=c.getContext('2d'); x.clearRect(0,0,c.width,c.height); t.userData.draw(x,c.width,c.height); t.needsUpdate=true; }
function noise(x,w,h,amt){ const img=x.getImageData(0,0,w,h), d=img.data; for(let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n; } x.putImageData(img,0,0); }
function textPlate(w,h,draw){ const t=canvasTex(w,h,draw); fontTex.push(t); return t; }
function plasterMat(rep=[1,1], tint='#efebe2'){
  return new THREE.MeshStandardMaterial({ roughness:.95, map:canvasTex(256,256,(x,w,h)=>{
    x.fillStyle=tint; x.fillRect(0,0,w,h); noise(x,w,h,10);
    const g=x.createLinearGradient(0,h*.7,0,h); g.addColorStop(0,'rgba(120,110,90,0)'); g.addColorStop(1,'rgba(120,110,90,.22)');
    x.fillStyle=g; x.fillRect(0,0,w,h);
  }, rep) });
}
function brickMat(rx,ry){
  return new THREE.MeshStandardMaterial({ roughness:.92, map:canvasTex(256,256,(x,w,h)=>{
    x.fillStyle='#b8b1a4'; x.fillRect(0,0,w,h);
    const bh=16,bw=48, cols=['#8e4a33','#9c5539','#7f412e','#a3603f','#874634','#94503a'];
    for(let r=0;r*bh<h;r++){ const off=(r%2)*bw/2; for(let c=-1;c*bw<w+bw;c++){ x.fillStyle=pick(cols); x.fillRect(c*bw+off+2, r*bh+2, bw-3, bh-3); } }
    noise(x,w,h,16);
  }, [rx,ry]) });
}
const std = (color,rough=.8,metal=0,extra={}) => new THREE.MeshStandardMaterial(Object.assign({color,roughness:rough,metalness:metal},extra));
function box(w,h,d,mat,x,y,z,parent=scene,cast=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z);
  m.castShadow=cast; m.receiveShadow=true; parent.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg=12,parent=scene){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function flat(w,d,mat,x,y,z){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat); m.rotation.x=-Math.PI/2; m.position.set(x,y,z); m.receiveShadow=true; scene.add(m); return m; }
function prismX(pts,x0,width,mat){
  const s=new THREE.Shape(); pts.forEach(([z,y],i)=> i ? s.lineTo(-z,y) : s.moveTo(-z,y)); s.closePath();
  const geo=new THREE.ExtrudeGeometry(s,{depth:width,bevelEnabled:false}); geo.rotateY(Math.PI/2);
  const m=new THREE.Mesh(geo,mat); m.position.x=x0; m.castShadow=m.receiveShadow=true; scene.add(m); return m;
}
function tileRoof(o){
  const {x0,width,yHi,zHi,yLo,zLo,colors,r=.12,sp=.26,slab=0x5d5045,ridge=false}=o;
  const g=new THREE.Group();
  const dy=yHi-yLo, dz=zLo-zHi, L=Math.hypot(dy,dz);
  g.position.set(x0+width/2,(yHi+yLo)/2,(zHi+zLo)/2);
  g.rotation.order='YXZ'; g.rotation.y = dz<0 ? Math.PI : 0; g.rotation.x = Math.atan2(dy,Math.abs(dz));
  const s=new THREE.Mesh(new THREE.BoxGeometry(width+.12,.07,L+.02), std(slab,1)); s.position.y=-.06; s.castShadow=s.receiveShadow=true; g.add(s);
  const cg=new THREE.CylinderGeometry(r,r,L,10), capG=new THREE.CircleGeometry(r*1.02,12);
  const mats=colors.map(c=>std(c,.72));
  const n=Math.max(1,Math.floor(width/sp)), start=-(n-1)*sp/2, d=new THREE.Object3D();
  mats.forEach((m,mi)=>{
    const idx=[]; for(let i=mi;i<n;i+=mats.length) idx.push(i); if(!idx.length) return;
    const im=new THREE.InstancedMesh(cg,m,idx.length), ic=new THREE.InstancedMesh(capG,m,idx.length);
    idx.forEach((i,k)=>{
      d.position.set(start+i*sp,-.02,0); d.rotation.set(Math.PI/2,0,0); d.updateMatrix(); im.setMatrixAt(k,d.matrix);
      d.position.set(start+i*sp,-.02,L/2+.003); d.rotation.set(0,0,0); d.updateMatrix(); ic.setMatrixAt(k,d.matrix);
    });
    im.castShadow=true; im.receiveShadow=true; g.add(im, ic);
  });
  if(ridge){ const rg=new THREE.Mesh(new THREE.CylinderGeometry(r*1.35,r*1.35,width+.14,12), mats[0]); rg.rotation.z=Math.PI/2; rg.position.set(0,.05,-L/2); rg.castShadow=true; g.add(rg); }
  scene.add(g); return g;
}

/* ---------------- 하늘·빛 ---------------- */
const skyTex = canvasTex(4,256,(x,w,h)=>{ const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#a9bccb'); g.addColorStop(.55,'#d8dcd7'); g.addColorStop(1,'#e6e0d1'); x.fillStyle=g; x.fillRect(0,0,w,h); });
scene.background = skyTex;
scene.fog = new THREE.Fog(0xdad9d2, 34, 95);
const hemi = new THREE.HemisphereLight(0xeef2f5, 0x8a7f6a, .78); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, .92);
const bigScreen = Math.min(innerWidth,innerHeight)>700;
sun.castShadow = true; sun.shadow.mapSize.set(bigScreen?2048:1024, bigScreen?2048:1024);
Object.assign(sun.shadow.camera,{left:-18,right:18,top:16,bottom:-14,near:1,far:60});
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

/* ---------------- 땅·길·논·물 ---------------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(SHORE_E-SHORE,220),
  new THREE.MeshStandardMaterial({roughness:1, map:canvasTex(256,256,(x,w,h)=>{ x.fillStyle='#8f8b83'; x.fillRect(0,0,w,h); noise(x,w,h,24); },[54,54])}));
ground.rotation.x=-Math.PI/2; ground.position.x=(SHORE+SHORE_E)/2; ground.receiveShadow=true; scene.add(ground);
flat(11,1.5, std(0xa9a49a,1), 1.2,.006,2.75);                              // 가게 앞 시멘트
flat(43-SHORE,3.2, new THREE.MeshStandardMaterial({roughness:1,map:canvasTex(256,64,(x,w,h)=>{ x.fillStyle='#6f6c67'; x.fillRect(0,0,w,h); noise(x,w,h,22); },[16,1])}), (SHORE+43)/2,.008,9.8); // 마을길
[8.3,11.3].forEach(z=> flat(43-SHORE,.08, std(0xe9e6dc,.9), (SHORE+43)/2,.012,z));   // 길 가장자리 흰 선: 강둑 경계돌까지 끝까지
// 논두렁 + 논
box(44-SHORE,.26,.5, std(0x8a7a5c,1), (SHORE+44)/2,.13,14.4);
flat(49-SHORE,40, new THREE.MeshStandardMaterial({roughness:1,map:canvasTex(256,256,(x,w,h)=>{ x.fillStyle='#a48f5e'; x.fillRect(0,0,w,h); x.strokeStyle='rgba(90,70,40,.35)'; x.lineWidth=2; for(let i=0;i<h;i+=8){ x.beginPath(); x.moveTo(0,i); x.lineTo(w,i); x.stroke(); } noise(x,w,h,18); },[14,6])}), (SHORE+49)/2,.01,35);
[-10,6,22].forEach(x=> box(.35,.22,40, std(0x8a7a5c,1), x,.11,35));
// 나루터: 모래톱, 강물, 나무 다리, 나룻배
// 강둑: 자갈 섞인 흙 띠 (땅과 물 사이에만)
const bankMat = new THREE.MeshStandardMaterial({roughness:1,map:canvasTex(128,256,(x,w,h)=>{ x.fillStyle='#8d8676'; x.fillRect(0,0,w,h);
  for(let i=0;i<420;i++){ x.fillStyle=pick(['#a49c8a','#7a7466','#b3ab98','#6d685c','#968e7c']); x.beginPath(); x.ellipse(rand(0,w),rand(0,h),rand(1.5,4.5),rand(1.2,3.5),rand(0,3),0,Math.PI*2); x.fill(); }
  noise(x,w,h,14); },[1,40])});
const bank = new THREE.Mesh(new THREE.PlaneGeometry(1.6,220), bankMat);
bank.rotation.x=-Math.PI/2; bank.rotation.y=-.12; bank.position.set(SHORE-.7,-.06,8); bank.receiveShadow=true; scene.add(bank);   // 물 쪽으로 살짝 기울어짐
box(.12,.1,220, std(0x6f6a5e,1), SHORE+.02,-.01,8, scene, false);  // 땅과 강둑 사이 경계돌
const water = flat(120,220, std(0x5f7c83,.2,.2), SHORE-1.2-60,-.12,8);
const pierMat = std(0x8a6a48,.85);
box(5.6,.08,1.0, pierMat, -18.65,.32,6.2);
for(let x=-21.2;x<=-16.2;x+=1.0){ cyl(.06,.06,.7,std(0x5e4630,.9),x,0,5.75); cyl(.06,.06,.7,std(0x5e4630,.9),x,0,6.65); }
const boat = new THREE.Group(); boat.position.set(-19.8,-.1,8.1); scene.add(boat);
box(2.4,.34,.9, std(0x7a5536,.85), 0,.17,0, boat);
box(2.2,.06,.78, std(0x5e4129,.9), 0,.32,0, boat);
[1,-1].forEach(s=>{ const b=box(.6,.34,.62, std(0x7a5536,.85), s*1.35,.22,0, boat); b.rotation.z=-s*.35; });
const oar=box(.05,.05,2.2, std(0x9a7b55,.8), .3,.45,.2, boat); oar.rotation.y=.5;
const naruSign = textPlate(320,128,(x,w,h)=>{ x.fillStyle='#e9dcc0'; x.fillRect(0,0,w,h); x.strokeStyle='#5e4630'; x.lineWidth=10; x.strokeRect(5,5,w-10,h-10);
  x.fillStyle='#3b2c1d'; x.font='72px "Do Hyeon", sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('나루터',w/2,h/2+4); });
cyl(.06,.06,1.6,std(0x5e4630,.9),-15.7,.8,5.4);
{ const plain=std(0x8a6a48,.85); const ns=new THREE.Mesh(new THREE.BoxGeometry(1.0,.4,.04),[plain,plain,plain,plain,new THREE.MeshStandardMaterial({map:naruSign,roughness:.8}),plain]);
  ns.position.set(-15.7,1.42,5.4+.09); ns.castShadow=true; scene.add(ns); }

/* ---------------- 나루슈퍼 ---------------- */
const SX0=-2.2, SX1=4.2, SZ0=-2, SZ1=2, SH=2.84;
box(SX1-SX0, SH, SZ1-SZ0, plasterMat([2,1]), (SX0+SX1)/2, SH/2, 0);
prismX([[SZ1,SH],[SZ0,SH],[SZ0,3.57]], SX0, SX1-SX0, plasterMat([1,1]));
tileRoof({x0:-2.45,width:6.9,yHi:3.62,zHi:-2.25,yLo:2.76,zLo:2.55,colors:['#c4552f','#b84a2a','#cf6236','#ad472b'],r:.12,sp:.25,ridge:true,slab:0x7a5a48});
const whiteMat = std(0xf1eee6,.85);
box(6.95,.3,.08, whiteMat, 1.0,2.6,2.57);
box(6.9,.04,.55, whiteMat, 1.0,2.46,2.3, scene, false);
const glassMat = std(0x27303a,.12,.55), frameMat = std(0xbfc2c4,.35,.75);
const doorGlass = box(2.4,2.2,.04, glassMat, 1.2,1.1,2.02);
[0,.6,1.2,1.8,2.4].forEach(x=> box(.06,2.22,.07, frameMat, x,1.11,2.05));
[.03,1.0,2.19].forEach(y=> box(2.46,.06,.07, frameMat, 1.2,y,2.05));
function poster(text,bg,fg,w,h,x,y,z,size=56){
  const t=textPlate(256,Math.round(256*h/w),(c,W,H)=>{ c.fillStyle=bg; c.fillRect(0,0,W,H); c.strokeStyle='rgba(0,0,0,.12)'; c.lineWidth=6; c.strokeRect(3,3,W-6,H-6);
    c.fillStyle=fg; c.font=`${size}px "Do Hyeon", sans-serif`; c.textAlign='center'; c.textBaseline='middle';
    const lines=text.split('\n'); lines.forEach((ln,i)=> c.fillText(ln, W/2, H/2+(i-(lines.length-1)/2)*size*1.05)); });
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({map:t,roughness:.8}));
  m.position.set(x,y,z); scene.add(m); return m;
}

const BR=.28;
const onPier=(x,z)=> x>=PIER.x0&&x<=PIER.x1&&z>=PIER.z0&&z<=PIER.z1;
const walkable=(x,z)=> (x>=AREA.x0&&x<=AREA.x1&&z>=AREA.z0&&z<=AREA.z1) || onPier(x,z);
function blockedFor(kind,x,z){
  if(!walkable(x,z)) return true;
  for(const o of OBST){
    if(o.only && o.only!==kind) continue;
    if(o.t==='r'){ if(x>o.x0-BR&&x<o.x1+BR&&z>o.z0-BR&&z<o.z1+BR) return true; }
    else { const dx=x-o.x, dz=z-o.z, R=o.r+BR; if(dx*dx+dz*dz<R*R) return true; }
  }
  return false;
}
function fixTarget(kind,x,z){
  if(!onPier(x,z)){ x=clamp(x,AREA.x0,AREA.x1); z=clamp(z,AREA.z0,AREA.z1); }
  for(let it=0;it<4;it++){
    let moved=false;
    for(const o of OBST){
      if(o.only && o.only!==kind) continue;
      if(o.t==='r'){
        const a=o.x0-BR-.03,b=o.x1+BR+.03,c=o.z0-BR-.03,d=o.z1+BR+.03;
        if(x>a&&x<b&&z>c&&z<d){
          const opts=[[a,z,x-a],[b,z,b-x],[x,c,z-c],[x,d,d-z]].filter(p=>walkable(p[0],p[1])).sort((p,q)=>p[2]-q[2]);
          if(opts.length){ x=opts[0][0]; z=opts[0][1]; moved=true; }
        }
      } else {
        const dx=x-o.x, dz=z-o.z, dd=Math.hypot(dx,dz), R=o.r+BR+.03;
        if(dd<R){ if(dd<1e-3){ x=o.x; z=o.z+R; } else { x=o.x+dx/dd*R; z=o.z+dz/dd*R; } moved=true; }
      }
    }
    if(!moved) break;
  }
  return {x,z};
}

const FT = {
  // 몸·머리: 앞쪽 깃이 뒤쪽 깃을 덮는 비늘 모양
  scale: canvasTex(256,256,(x,w,h)=>{
    x.fillStyle='#d6d6d6'; x.fillRect(0,0,w,h);
    const r=21, rows=[];
    for(let row=-1; row*r*1.05<h+r*2; row++) rows.push(row);
    rows.reverse().forEach(row=>{ const off=(row%2)*r;
      for(let col=-1; col*r*2<w+r*2; col++){
        const cx=col*r*2+off, cy=row*r*1.05;
        const g=x.createRadialGradient(cx,cy,1,cx,cy+r*.3,r*1.25);
        g.addColorStop(0,'#ffffff'); g.addColorStop(.75,'#ececec'); g.addColorStop(1,'#b4b4b4');
        x.fillStyle=g; x.beginPath(); x.ellipse(cx,cy,r*1.15,r*1.25,0,0,Math.PI); x.fill();
        x.strokeStyle='rgba(255,255,255,.18)'; x.lineWidth=1;
        for(let k=-3;k<=3;k++){ x.beginPath(); x.moveTo(cx,cy+2); x.lineTo(cx+k*4,cy+r*1.1); x.stroke(); }
      } });
    noise(x,w,h,9);
  },[3,2]),
  // 날개·꽁지: 깃대와 깃가지
  long: canvasTex(128,256,(x,w,h)=>{
    x.fillStyle='#dcdcdc'; x.fillRect(0,0,w,h);
    for(const cx of [w*.25,w*.75]){
      x.strokeStyle='rgba(255,255,255,.4)'; x.lineWidth=2; x.beginPath(); x.moveTo(cx,0); x.lineTo(cx,h); x.stroke();
      x.lineWidth=1;
      for(let y=-20;y<h+20;y+=4){
        x.strokeStyle=`rgba(${Math.random()<.5?'255,255,255':'90,90,90'},.14)`;
        x.beginPath(); x.moveTo(cx,y); x.lineTo(cx-w*.24,y+14); x.stroke();
        x.beginPath(); x.moveTo(cx,y); x.lineTo(cx+w*.24,y+14); x.stroke();
      }
    }
    noise(x,w,h,20);
  },[2,1]),
  // 솜털 껍질: 짧은 털 가닥 (밝을수록 바깥 껍질까지 남음)
  fluff: canvasTex(256,256,(x,w,h)=>{
    x.fillStyle='#000'; x.fillRect(0,0,w,h);
    for(let i=0;i<2600;i++){

      x.strokeStyle=`rgb(${v},${v},${v})`; x.lineWidth=rand(.8,1.8);
      x.beginPath(); x.moveTo(px,py); x.lineTo(px+rand(-1.5,1.5),py+len); x.stroke();
    }

};
FT.fluff.encoding=THREE.LinearEncoding;
function featherMat(color,sheen,{tex='scale',rough=.9,bump=.3}={}){
  const m=new THREE.MeshPhysicalMaterial({color,roughness:rough,metalness:0,map:FT[tex],bumpMap:FT[tex],bumpScale:bump});
  if(sheen!=null) m.sheen=new THREE.Color(sheen);
  return m;
}
const fluffCache={};
function fluffMat(color,at){ const k=color+'_'+at; return fluffCache[k] || (fluffCache[k]=new THREE.MeshStandardMaterial({color,roughness:1,metalness:0,alphaMap:FT.fluff,alphaTest:at})); }
const BM = {
  kBody:featherMat(0x15171c,0x141c2c), kWing:featherMat(0x1b2d4c,0x173a3a,{tex:'long',bump:.4}),
  white:featherMat(0xf1eee6,null,{rough:.97,bump:.25}), whiteLong:featherMat(0xf3f0e8,null,{tex:'long',rough:.97,bump:.3}),
  cBody:featherMat(0x0c0c0f,0x1b1730), cWing:featherMat(0x0f0f12,0x18152c,{tex:'long',bump:.4}),
  beak:std(0x17171a,.45), leg:std(0x26262a,.75),
  eyeW:std(0xffffff,.3), eyeB:std(0x050505,.12,.2), eyeGold:std(0xb9a46a,.3,.4)

function ell(mat,sx,sy,sz,x,y,z,parent,geo=SPH,shadow=true){ const m=new THREE.Mesh(geo,mat); m.scale.set(sx,sy,sz); m.position.set(x,y,z); m.castShadow=shadow; parent.add(m); return m; }
// 솜털 껍질 두 겹 (가까울 때만 보임)
function fluffy(base,color,list,layers=[[1.06,.42],[1.12,.7]]){
  for(const [k,at] of layers){
    const m=new THREE.Mesh(base.geometry,fluffMat(color,at));
    m.scale.copy(base.scale).multiplyScalar(k); m.position.copy(base.position); m.rotation.copy(base.rotation);
    base.parent.add(m); list.push(m);
  }
}
function lerpAngle(a,b,t){ const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; }
function makeLabel(cls,text){

}

let actx=null, muted=false;
function ac(){ if(muted) return null; if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(actx.state==='suspended') actx.resume().catch(()=>{}); return actx; }
function tone({type='sine',f0,f1,dur,vol=.06,delay=0,lp}){
  const a=ac(); if(!a) return; const t0=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain(); o.type=type;
  o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); let out=g; if(lp){ const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; g.connect(f); out=f; }
  out.connect(a.destination); o.start(t0); o.stop(t0+dur+.03);
}

let featherBits=[];
function spawnFeathers(b){
  const sc=b.g.scale.x;
  for(let i=0;i<7;i++){
    const base = b.kind==='crow' ? BM.cBody : (Math.random()<.45 ? BM.white : BM.kBody);
    const mat=base.clone(); mat.transparent=true; mat.depthWrite=false;
    const m=new THREE.Mesh(SPHZ,mat); m.scale.set(.028*sc,.006*sc,.05*sc);
    m.position.set(b.pos.x+rand(-.15,.15), b.pos.y+.4*sc, b.pos.z+rand(-.15,.15)); scene.add(m);
    featherBits.push({m, v:new THREE.Vector3(rand(-1,1),rand(1,1.9),rand(-1,1)), spin:new THREE.Vector3(rand(-6,6),rand(-6,6),rand(-6,6)), life:rand(1.6,2.2), seed:rand(0,6)});
  }
}
function updateFeathers(dt,t){
  for(const f of featherBits){
    f.life-=dt; const p=f.m.position;
    if(p.y>.02){ f.v.y-=1.6*dt; f.v.multiplyScalar(1-1.6*dt); p.addScaledVector(f.v,dt); p.x+=Math.sin(t*5+f.seed)*.25*dt;
      f.m.rotation.x+=f.spin.x*dt; f.m.rotation.y+=f.spin.y*dt; f.m.rotation.z+=f.spin.z*dt; }
    else { p.y=.02; f.m.rotation.x=Math.PI/2*0; }
    f.m.material.opacity=Math.min(1,f.life/.6);
    if(f.life<=0){ scene.remove(f.m); f.m.material.dispose(); }
  }
  featherBits=featherBits.filter(f=>f.life>0);
}

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const ring=new THREE.Mesh(new THREE.RingGeometry(.2,.27,32), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));
ring.rotation.x=-Math.PI/2; ring.position.y=.02; scene.add(ring); let ringT=0;
function findRef(o){ while(o){ if(o.userData&&o.userData.ref) return o.userData.ref; o=o.parent; } return null; }
doorGlass.userData.ref={isDoor:true}; well.userData.ref={isWell:true};
function onTap(cx,cy){
  if(!me||anyModal()) return;
  ndc.set(cx/innerWidth*2-1, -(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const targets=[...machines.map(m=>m.group), ...birds.map(b=>b.g), owner.g, doorGlass, well];
  const hits=ray.intersectObjects(targets,true);
  for(const h of hits){
    const ref=findRef(h.object); if(!ref) continue;
    if(ref.isMachine){ useMachine(ref); return; }
    if(ref.isOwner || ref.isDoor){ approachOwner(); return; }
    if(ref.isWell){ me.moveTo(-6.5,6.15,()=>{ me.faceTo({x:-6.5,z:5}); me.say('우물 속에 구슬 두 개가 비친다',2.4); }); return; }
    if(ref.isBird){
      if(ref.fly) continue;
      if(ref===me){ me.greet(); birds.filter(b=>!b.isMe&&!b.leaving&&!b.fly&&b.pos.distanceTo(me.pos)<3).forEach(b=>{ if(Math.random()<.65) setTimeout(()=>{ b.target=null; b.onArrive=null; b.faceTo(me.pos); b.greet(); },rand(350,900)); }); }
      else{
        const o=ref, dir=me.pos.clone().sub(o.pos); dir.y=0; if(dir.lengthSq()<1e-4) dir.set(1,0,0); dir.normalize().multiplyScalar(.85);
        me.moveTo(o.pos.x+dir.x,o.pos.z+dir.z,()=>{ me.faceTo(o.pos); me.greet(); if(!o.leaving&&!o.fly){ o.target=null; o.onArrive=null; o.faceTo(me.pos); setTimeout(()=>o.greet(),450); } });
      }
      return;
    }
  }
  const gh=ray.intersectObject(ground);
  if(gh.length){
    me.moveTo(gh[0].point.x, gh[0].point.z);
    ring.position.x=me.target.x; ring.position.z=me.target.z; ring.position.y=baseY(me.target.x)+.02; ringT=.6;
    if(role==='kkachi' && Math.hypot(gh[0].point.x-OWNER_POS.x, gh[0].point.z-OWNER_POS.z)<1.55) toast('주인 아주머니 곁은 까마귀(후원자)만 갈 수 있어요.');
  }
}

// 미리보기: 주소 끝에 #hour-19 처럼 붙이면 그 시각으로 봄
let hourOverride=null;
function readHash(){ const m=/^#hour-(\d{1,2})(?:-(\d{2}))?$/.exec(location.hash||''); hourOverride = m ? (Math.min(23,+m[1]) + (m[2]?(+m[2])/60:0)) : null; }
readHash(); addEventListener('hashchange',()=>{ readHash(); updateClock(true); });
function kstNow(){
  const d=new Date(Date.now()+9*3600e3);
  const doy=Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,1))/864e5);
  const h = hourOverride!==null ? hourOverride : d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;
  return {h,doy};
}
// 서울 근사: 해 길이는 동지 약 9.8시간 ~ 하지 약 14.6시간, 남중 약 12시 24분
function sunInfo(h,doy){
  const D=12.2-2.4*Math.cos(2*Math.PI*(doy+10)/365), noon=12.4, rise=noon-D/2, set=noon+D/2;
  let e; // 해 높이 -1(한밤)~1(한낮)
  if(h>=rise && h<=set) e=Math.sin(Math.PI*(h-rise)/D);
  else { const N=24-D, t=(h>set? h-set : h+24-set)/N; e=-Math.sin(Math.PI*t); }
  const th=clamp((h-rise)/D,0,1)*Math.PI;
  return {e, th, rise, set};
}
const PAL = {
  night:{top:'#070d24',mid:'#111a36',bot:'#1c2542',fog:'#121a33',sky:'#5466a0',gnd:'#0e0e16',hemi:.17,sunC:'#9fb6ff',sun:.2},
  dusk: {top:'#36457c',mid:'#d08a72',bot:'#f4ad6e',fog:'#c08c74',sky:'#f6b88e',gnd:'#4a3a32',hemi:.5,sunC:'#ff9a55',sun:.75},
  day:  {top:'#a9bccb',mid:'#d8dcd7',bot:'#e6e0d1',fog:'#dad9d2',sky:'#eef2f5',gnd:'#8a7f6a',hemi:.78,sunC:'#fff1dc',sun:.92}
};
const _c1=new THREE.Color(), _c2=new THREE.Color();
const mixC=(a,b,t)=>'#'+_c1.set(a).lerp(_c2.set(b),t).getHexString();
function blendPal(e){
  let A,B,t;
  if(e>=.25){ A=PAL.day; B=PAL.day; t=0; }
  else if(e>=0){ A=PAL.dusk; B=PAL.day; t=e/.25; }
  else if(e>=-.18){ A=PAL.night; B=PAL.dusk; t=(e+.18)/.18; }
  else { A=PAL.night; B=PAL.night; t=0; }
  const o={}; for(const k in A) o[k] = typeof A[k]==='number' ? A[k]+(B[k]-A[k])*t : mixC(A[k],B[k],t);
  return o;
}
// 밤하늘: 별·달
const stars=(()=>{ const n=500, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const a=rand(0,Math.PI*2), el=rand(.12,1.4), r=150; pos[i*3]=Math.cos(a)*Math.cos(el)*r; pos[i*3+1]=Math.sin(el)*r; pos[i*3+2]=Math.sin(a)*Math.cos(el)*r-30; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.Points(g,new THREE.PointsMaterial({color:0xfff8e8,size:1.3,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));
  scene.add(m); return m; })();
const moon=new THREE.Mesh(new THREE.SphereGeometry(4,24,16), new THREE.MeshBasicMaterial({color:0xf3eed8,fog:false,transparent:true,opacity:0}));
moon.position.set(-40,70,-110); scene.add(moon);
const storeLight=new THREE.PointLight(0xffd59a,0,11,1.6); storeLight.position.set(1.2,2.3,3.4); scene.add(storeLight);
glassMat.emissive=new THREE.Color(0xffd7a0); glassMat.emissiveIntensity=0;
const sunOff=new THREE.Vector3(9,16,9);
let clockT=0, lastSij=-1;
function updateClock(force){
  const {h,doy}=kstNow(), S=sunInfo(h,doy), P=blendPal(S.e);
  // 하늘·안개·빛
  skyTex.userData.draw=(x,w,hh)=>{ const g=x.createLinearGradient(0,0,0,hh); g.addColorStop(0,P.top); g.addColorStop(.55,P.mid); g.addColorStop(1,P.bot); x.fillStyle=g; x.fillRect(0,0,w,hh); };
  redrawTex(skyTex);
  scene.fog.color.set(P.fog);
  hemi.color.set(P.sky); hemi.groundColor.set(P.gnd); hemi.intensity=P.hemi;
  sun.color.set(P.sunC); sun.intensity=P.sun;
  if(S.e>0) sunOff.set(Math.cos(S.th)*14, 3+S.e*14, 9); else sunOff.set(-6,14,8);   // 낮: 해(동→남→서), 밤: 달빛
  // 밤 불빛
  const n=1-clamp((S.e+.12)/.22,0,1);
  signFace.emissiveIntensity=.22+n*.95; glassMat.emissiveIntensity=n*1.1; lampMat.emissiveIntensity=n*2.4;
  storeLight.intensity=n*2.2; stars.material.opacity=n*.9; moon.material.opacity=n;
  // 십이시 표시
  const hh=Math.floor(h), mm=Math.floor((h-hh)*60), i=Math.floor(((h+1)%24)/2);
  const el=$('#sijin');
  el.textContent=`${SIJIN[i]}시(${SIJIN_H[i]}時) · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}${i===4?' · 용의 때':''}${hourOverride!==null?' · 미리보기':''}`;
  el.classList.toggle('jin',i===4); el.classList.toggle('night',i!==4&&n>.5);
  if(i!==lastSij){ lastSij=i; }
}
updateClock(true);

/* ---------------- 루프 ---------------- */
const clock=new THREE.Clock(), v3=new THREE.Vector3();
function placeLabel(el,pos,yOff,isNpc){
  v3.copy(pos); v3.y += yOff; v3.project(camera);
  if(v3.z>1||v3.x<-1.3||v3.x>1.3||v3.y<-1.3||v3.y>1.3){ el.style.display='none'; return; }
  el.style.display='';
  el.style.transform=`translate(${(v3.x*.5+.5)*innerWidth}px,${(-v3.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;
  if(isNpc) el.classList.toggle('near', !!me && pos.distanceTo(me.pos)<2.4);
}
function loop(){
  if(munjinOpen){ requestAnimationFrame(loop); return; }   // 문진을 펴 둔 동안에는 3D 마을을 그리지 않아 폰이 문진에만 힘을 씀
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  for(const b of birds.slice()){ npcThink(b,dt); b.update(dt,t); }
  owner.update(dt,t);
  machines.forEach(m=>m.update(dt,t));
  updateFeathers(dt,t);
  for(const c of capsules){
    c.v.y-=9.8*dt; c.obj.position.addScaledVector(c.v,dt); c.obj.rotation.x+=dt*8;
    if(c.obj.position.y<.075){ c.obj.position.y=.075; c.v.y*=-.38; c.v.x*=.7; c.v.z*=.7; }
  }
  if(ringT>0){ ringT-=dt; ring.material.opacity=Math.max(0,ringT/.6)*.85; ring.scale.setScalar(1+(.6-ringT)*.9); }
  boat.position.y=-.1+Math.sin(t*1.3)*.035; boat.rotation.z=Math.sin(t*1.1)*.03; boat.rotation.x=Math.sin(t*.9)*.02;
  water.material.color.setHSL(.53,.12,.5+Math.sin(t*.5)*.01);

  crowdT-=dt;
  if(crowdT<0){
    crowdT=rand(10,20);
    const npcs=birds.filter(b=>!b.isMe&&!b.leaving&&!b.fly);
    if(Math.random()<.5 && npcs.length>11){ pick(npcs).flyAway(); }
    else if(npcs.length<18){ spawnNpc(true); updateCount(); }
  }

  if(down && down.fly && me && me.air==='up'){ const g=groundPoint(down.cx,down.cy); if(g) steer=g; }
  updateWing(dt);
  const tx = me ? clamp(me.pos.x,-20,16) : 1.8;
  const tz = me ? clamp(me.pos.z-1.2,2.6,13.5) : 3.4;
  const ty = me ? 1.1+me.pos.y*.55 : 1.1;
  camLook.x += (tx-camLook.x)*Math.min(1,dt*2.6);
  camLook.z += (tz-camLook.z)*Math.min(1,dt*2.6);
  camLook.y += (ty-camLook.y)*Math.min(1,dt*2.6);
  camera.position.copy(camLook).addScaledVector(camDir,camDist); camera.lookAt(camLook);
  sun.target.position.set(camLook.x,0,camLook.z); sun.position.set(camLook.x+sunOff.x,sunOff.y,camLook.z+sunOff.z);
  clockT-=dt; if(clockT<0){ clockT=1; updateClock(); }

  for(const b of birds){
    const near=b.pos.distanceToSquared(camLook)<196;
    if(near!==b.shellOn){ b.shellOn=near; b.shells.forEach(m=>m.visible=near); }
    placeLabel(b.el,b.pos,(b.kind==='crow'?1.12:1.0),!b.isMe);
  }
  placeLabel(owner.el,owner.pos,2.05,false);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
updateCount();
loop();
})();
</script>
